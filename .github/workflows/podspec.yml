name: Podspec

# Lints the podspecs with CocoaPods, which runs only on macOS; kept out of ci.yml as it runs only when a podspec changes.
#
# No `tags:` filter: with `paths:` it stops branch pushes from matching.
on:
  push:
    branches: [main]
    paths:
      - '**.podspec'
      - '.github/workflows/podspec.yml'
  pull_request:
    paths:
      - '**.podspec'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: pod lib lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          pod --version
          xcodebuild -version

      # PayCrossCore goes first; --include-podspecs makes PayCross resolve it locally, not from the trunk CDN.
      - name: Lint PayCrossCore
        run: |
          pod lib lint PayCrossCore.podspec \
            --no-clean \
            --verbose

      - name: Lint PayCross
        run: |
          pod lib lint PayCross.podspec \
            --include-podspecs='PayCrossCore.podspec' \
            --no-clean \
            --verbose
