name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Proves PayCrossCore (state, validation, JWT, wire models) on a Linux runner.
  core:
    name: Core (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test

  # Only macOS can compile the UIKit/SwiftUI/WebKit target for iOS.
  ios:
    name: iOS build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # The iOS 26.4 runtime reports version 26.4.1, so OS= cannot be hand-written.
      - name: Resolve a simulator destination
        id: sim
        run: |
          set -euo pipefail
          xcrun simctl list runtimes
          OS=$(xcrun simctl list runtimes --json \
            | python3 -c "import json,sys; rs=[r for r in json.load(sys.stdin)['runtimes'] if r['isAvailable'] and r['identifier'].find('iOS')>=0]; print(sorted(r['version'] for r in rs)[-1])")
          echo "Selected iOS runtime: $OS"
          echo "os=$OS" >> "$GITHUB_OUTPUT"

      # SwiftPM's library schemes have no test action, so tests run via the -Package scheme.
      - name: List schemes
        run: xcodebuild -list

      - name: Test and render screenshots
        env:
          TEST_RUNNER_PAYCROSS_SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/screenshots"
          xcodebuild test \
            -scheme PayCross-Package \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=${{ steps.sim.outputs.os }}" \
            -resultBundlePath "${{ github.workspace }}/TestResults.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      # Fallback for when the simulator sandbox blocks writes to the workspace path.
      - name: Extract attachments if the direct write produced nothing
        if: always()
        run: |
          set -uo pipefail
          if [ -z "$(ls -A "${{ github.workspace }}/screenshots" 2>/dev/null)" ]; then
            echo "No PNGs written directly; falling back to xcresult attachments."
            xcrun xcresulttool export attachments \
              --path "${{ github.workspace }}/TestResults.xcresult" \
              --output-path "${{ github.workspace }}/screenshots" 2>&1 | tail -5 || \
              echo "::warning::could not extract attachments"
          fi
          ls -la "${{ github.workspace }}/screenshots" || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: card-form-screenshots
          path: ${{ github.workspace }}/screenshots
          if-no-files-found: warn

  # Fails if PayCrossCore imports a UI framework or a PayCross file lacks a platform guard.
  invariants:
    name: Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Linux-buildable targets import no UI framework
        run: |
          set -euo pipefail
          status=0
          for t in PayCrossCore DemoHarnessCore; do
            if grep -rnE '^\s*import (UIKit|SwiftUI|WebKit|PassKit)' "Sources/$t"; then
              echo "::error::$t must stay platform-agnostic so it builds on Linux."
              status=1
            fi
          done
          exit $status

      - name: Every iOS-only source is guarded by #if os(iOS)
        run: |
          set -euo pipefail
          status=0
          for f in $(find Sources/PayCross Sources/DemoHarnessUI -name '*.swift'); do
            if ! head -5 "$f" | grep -q '#if os(iOS)'; then
              echo "::error file=$f::missing '#if os(iOS)' guard; this breaks the Linux build"
              status=1
            fi
          done
          exit $status

      - name: No card data may reach disk
        run: |
          set -euo pipefail
          # Comments are stripped first; DeviceLanguages is held out because it reads a system-owned key.
          seam=Sources/PayCrossCore/Localization/DeviceLanguages.swift
          if find Sources -name '*.swift' ! -path "$seam" -exec sed -E 's://.*::' {} + \
             | grep -nE '@AppStorage|@SceneStorage|UserDefaults|SecItemAdd|UIPasteboard'; then
            echo "::error::persistence API referenced in SDK sources"
            exit 1
          fi
          # Fails if the held-out file moves, so the exemption cannot outlive it.
          test -f "$seam" || {
            echo "::error::$seam is gone; the exemption above now covers nothing"
            exit 1
          }
          if sed -E 's://.*::' "$seam" \
             | grep -nE '@AppStorage|@SceneStorage|SecItemAdd|UIPasteboard'; then
            echo "::error::persistence API referenced in $seam"
            exit 1
          fi
          # The only UserDefaults allowed here is the defaults parameter defaulting to .standard.
          if sed -E 's://.*::' "$seam" | grep -n 'UserDefaults' \
             | grep -vE 'defaults: UserDefaults = \.standard'; then
            echo "::error::$seam may only take a UserDefaults to read from"
            exit 1
          fi
          # An allowlist: a denylist let setPersistentDomain through, which needs no UserDefaults token.
          if sed -E 's://.*::' "$seam" | grep -oE 'defaults\.[A-Za-z]+' \
             | grep -v '^defaults\.stringArray$'; then
            echo "::error::$seam may only read stringArray(forKey:) from the defaults it takes"
            exit 1
          fi
          if sed -E 's://.*::' "$seam" \
             | grep -nE '\.set\(|\.setValue\(|removeObject|PersistentDomain|register\(defaults'; then
            echo "::error::$seam writes to UserDefaults"
            exit 1
          fi
          echo "ok"

      - name: Every published test identifier is applied
        run: |
          set -euo pipefail
          status=0
          source=Sources/PayCross/TestIdentifiers.swift
          # Fails if the file is gone, so the loops below cannot pass having checked nothing.
          test -f "$source" || {
            echo "::error::$source is gone; this check would pass while checking nothing"
            exit 1
          }

          names=$(grep -oE '^[[:space:]]*case [a-zA-Z]+ = "paycross\.' "$source" \
            | awk '{print $2}')
          count=$(printf '%s\n' "$names" | grep -c . || true)
          # Floor: a pattern that stops matching fails instead of checking nothing.
          if [ "$count" -lt 25 ]; then
            echo "::error::found $count identifiers in $source, expected at least 25"
            exit 1
          fi
          echo "checking $count identifiers"

          for name in $names; do
            if ! grep -rqE "payCross(Container)?Identifier\(\.$name\)|PayCrossTestIdentifiers\.$name\b" \
                 --include='*.swift' Sources/PayCross --exclude=TestIdentifiers.swift; then
              echo "::error::PayCrossTestIdentifiers.$name is published and applied nowhere."
              status=1
            fi
          done

          # Composed helpers are not enum cases, so the loop above cannot see them.
          helpers=$(grep -oE 'public static func [a-zA-Z]+\(' "$source" \
            | awk '{print $4}' | tr -d '(')
          if [ "$(printf '%s\n' "$helpers" | grep -c . || true)" -lt 4 ]; then
            echo "::error::expected at least 4 composed identifier helpers"
            exit 1
          fi
          for helper in $helpers; do
            if ! grep -rqE "PayCrossTestIdentifiers\.$helper\(" \
                 --include='*.swift' Sources/PayCross --exclude=TestIdentifiers.swift; then
              echo "::error::PayCrossTestIdentifiers.$helper is published and applied nowhere."
              status=1
            fi
          done
          exit $status

      - name: A container's identifier leaves its children theirs
        run: |
          set -euo pipefail
          # A container's identifier is inherited by its children; list any new container here.
          status=0
          for name in sheet savedCards; do
            if grep -rnF "payCrossIdentifier(.$name)" \
                 --include='*.swift' Sources/PayCross --exclude=TestIdentifiers.swift; then
              echo "::error::.$name names a container: apply it with payCrossContainerIdentifier"
              status=1
            fi
            if ! grep -rqF "payCrossContainerIdentifier(.$name)" \
                 --include='*.swift' Sources/PayCross --exclude=TestIdentifiers.swift; then
              echo "::error::.$name is no longer applied as a container."
              status=1
            fi
          done
          exit $status

      - name: A field's identifier is on its box, not on its column
        run: |
          set -euo pipefail
          # A column's identifier is inherited by its label, box and message, so the field identifier stays on the box.
          file=Sources/PayCross/UI/FieldGroupsView.swift
          test -f "$file" || {
            echo "::error::$file is gone; this check would pass while checking nothing"
            exit 1
          }
          marker='private var inputBox'
          for pattern in "$marker" 'PayCrossTestIdentifiers\.field\(group:' \
                         'PayCrossTestIdentifiers\.fieldError\(group:'; do
            if [ "$(grep -cE "$pattern" "$file" || true)" -ne 1 ]; then
              echo "::error::expected exactly one '$pattern' in $file"
              exit 1
            fi
          done
          box=$(grep -nE "$marker" "$file" | cut -d: -f1)
          field=$(grep -nE 'PayCrossTestIdentifiers\.field\(group:' "$file" | cut -d: -f1)
          error=$(grep -nE 'PayCrossTestIdentifiers\.fieldError\(group:' "$file" | cut -d: -f1)
          if [ "$field" -lt "$box" ]; then
            echo "::error::the field identifier is on the column again; it eats the message's .error"
            exit 1
          fi
          if [ "$error" -gt "$box" ]; then
            echo "::error::the validation message's identifier is no longer on the message"
            exit 1
          fi
          echo "ok"

      - name: Every field on the sheet is named once
        run: |
          set -euo pipefail
          # Unit tests cannot see the accessibility tree, so these lines are checked on a simulator.
          status=0
          sheet=Sources/PayCross/UI/FieldGroupsView.swift
          card=Sources/PayCross/UI/CardFormView.swift
          numeric=Sources/PayCross/UI/NumericField.swift
          for f in "$sheet" "$card" "$numeric"; do
            test -f "$f" || {
              echo "::error::$f is gone; this check would pass while checking nothing"
              exit 1
            }
          done

          # The name on each control.
          if [ "$(grep -cF 'Picker(accessibleName' "$sheet")" -ne 1 ]; then
            echo "::error::the select must be built with accessibleName, not with the drawn title"
            status=1
          fi
          if grep -nF 'Picker(title' "$sheet"; then
            echo "::error::the drawn title carries a '*'; the spoken name must say the word"
            status=1
          fi
          if [ "$(grep -cF '.accessibilityLabel(accessibleName)' "$sheet")" -ne 1 ]; then
            echo "::error::the server-driven text field has lost its accessible name"
            status=1
          fi
          # Named both in makeUIView and in updateUIView.
          if [ "$(grep -cF 'field.accessibilityLabel = accessibleName' "$numeric")" -ne 2 ]; then
            echo "::error::the UIKit-backed card fields must be named on build AND on update"
            status=1
          fi
          # The cardholder TextField is named at its call site, not in NumericField.
          if [ "$(grep -cF '.accessibilityLabel(cardholderTitle)' "$card")" -ne 1 ]; then
            echo "::error::the cardholder field has lost its accessible name; it would announce only its placeholder"
            status=1
          fi

          # Comments and blank lines are stripped first, so the modifier is searched within six lines.
          for f in "$sheet" "$card"; do
            headings=$(grep -cF 'Text(title)' "$f")
            if [ "$headings" -lt 1 ]; then
              echo "::error::no 'Text(title)' in $f; this check now covers nothing"
              exit 1
            fi
            hidden=$(sed -E 's://.*::' "$f" | grep -vE '^[[:space:]]*$' \
              | grep -A6 -F 'Text(title)' | grep -cF '.accessibilityHidden(true)' || true)
            if [ "$hidden" -ne "$headings" ]; then
              echo "::error::$f draws $headings heading(s) and hides $hidden; a visible heading is the field announced twice"
              status=1
            fi
          done
          exit $status

      - name: The shopper's typing is never cut short
        run: |
          set -euo pipefail
          # max_length is a validation rule checked on Pay, not a trim while typing.
          status=0
          file=Sources/PayCross/UI/FieldGroupsView.swift
          test -f "$file" || {
            echo "::error::$file is gone; this check would pass while checking nothing"
            exit 1
          }
          if grep -nE '\.prefix\(|onChange\(of: value' "$file"; then
            echo "::error::the sheet is cutting the shopper's typing short again"
            status=1
          fi
          # Checks the max_length rule still exists, so the step cannot pass with the limit removed.
          core=Sources/PayCrossCore/Form/FieldGroupLogic.swift
          if ! grep -q 'validation?.maxLength' "$core"; then
            echo "::error::$core no longer enforces the server's max_length"
            status=1
          fi
          exit $status

      - name: No identifier is set from a literal
        run: |
          set -euo pipefail
          # Identifiers come only from PayCrossTestIdentifiers.
          status=0
          if grep -rnE 'accessibilityIdentifier[[:space:]]*(\(|=)[[:space:]]*"' \
             --include='*.swift' Sources/PayCross; then
            status=1
          fi
          # Also catches a literal on the line after the call; a line starting with an expression is allowed.
          if grep -rn -A1 --include='*.swift' \
               -E 'accessibilityIdentifier[[:space:]]*(\(|=)[[:space:]]*$' Sources/PayCross \
             | grep -E '^.*-[0-9]+-[[:space:]]*"'; then
            status=1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::set the identifier from PayCrossTestIdentifiers, not from a literal"
            exit 1
          fi
          echo "ok"
