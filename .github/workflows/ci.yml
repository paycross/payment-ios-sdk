name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The whole point of the Core/UI split: this job proves the payment state
  # machine, validation, JWT decoding and wire models on a free Linux runner,
  # in seconds, on every push. Most of the SDK's behaviour is verified here.
  core:
    name: Core (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test

  # macOS minutes are ~10x Linux and draw down the monthly allotment on a private
  # repo, so this job exists to prove one thing Linux cannot: that the UIKit /
  # SwiftUI / WebKit target actually compiles for iOS.
  ios:
    name: iOS build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # The runtime advertised as "iOS 26.4" has version string 26.4.1, so an
      # OS= pin written by hand silently fails to match. Ask simctl instead.
      - name: Resolve a simulator destination
        id: sim
        run: |
          set -euo pipefail
          xcrun simctl list runtimes
          OS=$(xcrun simctl list runtimes --json \
            | python3 -c "import json,sys; rs=[r for r in json.load(sys.stdin)['runtimes'] if r['isAvailable'] and r['identifier'].find('iOS')>=0]; print(sorted(r['version'] for r in rs)[-1])")
          echo "Selected iOS runtime: $OS"
          echo "os=$OS" >> "$GITHUB_OUTPUT"

      # Renders every card-form state to a PNG. This is the only way the UI gets
      # looked at until there is a Mac in the loop, so it runs on every push.
      # TEST_RUNNER_ prefixed variables are forwarded into the test process.
      # SwiftPM's per-library scheme has no test action; the generated
      # "<Package>-Package" scheme is the one that carries the test targets.
      - name: List schemes
        run: xcodebuild -list

      - name: Test and render screenshots
        env:
          TEST_RUNNER_PAYCROSS_SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/screenshots"
          xcodebuild test \
            -scheme PayCross-Package \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=${{ steps.sim.outputs.os }}" \
            -resultBundlePath "${{ github.workspace }}/TestResults.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      # Belt and braces: if writing to the workspace path is blocked by the
      # simulator sandbox, the PNGs still exist as XCTAttachments in the bundle.
      - name: Extract attachments if the direct write produced nothing
        if: always()
        run: |
          set -uo pipefail
          if [ -z "$(ls -A "${{ github.workspace }}/screenshots" 2>/dev/null)" ]; then
            echo "No PNGs written directly; falling back to xcresult attachments."
            xcrun xcresulttool export attachments \
              --path "${{ github.workspace }}/TestResults.xcresult" \
              --output-path "${{ github.workspace }}/screenshots" 2>&1 | tail -5 || \
              echo "::warning::could not extract attachments"
          fi
          ls -la "${{ github.workspace }}/screenshots" || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: card-form-screenshots
          path: ${{ github.workspace }}/screenshots
          if-no-files-found: warn

  # Guards the property the Linux job depends on: nothing in PayCrossCore may
  # import a UI framework, and every file in PayCross must be platform-guarded.
  # Without this the Core/UI split rots the first time someone adds an import.
  invariants:
    name: Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Linux-buildable targets import no UI framework
        run: |
          set -euo pipefail
          status=0
          for t in PayCrossCore DemoHarnessCore; do
            if grep -rnE '^\s*import (UIKit|SwiftUI|WebKit|PassKit)' "Sources/$t"; then
              echo "::error::$t must stay platform-agnostic so it builds on Linux."
              status=1
            fi
          done
          exit $status

      - name: Every iOS-only source is guarded by #if os(iOS)
        run: |
          set -euo pipefail
          status=0
          for f in $(find Sources/PayCross Sources/DemoHarnessUI -name '*.swift'); do
            if ! head -5 "$f" | grep -q '#if os(iOS)'; then
              echo "::error file=$f::missing '#if os(iOS)' guard; this breaks the Linux build"
              status=1
            fi
          done
          exit $status

      - name: No card data may reach disk
        run: |
          set -euo pipefail
          # Strip comments first: the sources legitimately *discuss* these APIs.
          if find Sources -name '*.swift' -exec sed -E 's://.*::' {} + \
             | grep -nE '@AppStorage|@SceneStorage|UserDefaults|SecItemAdd|UIPasteboard'; then
            echo "::error::persistence API referenced in SDK sources"
            exit 1
          fi
          echo "ok"

      - name: Every published test identifier is applied
        run: |
          set -euo pipefail
          status=0
          source=Sources/PayCross/TestIdentifiers.swift
          # Without this the loops below iterate zero times and the job goes
          # green having checked nothing, which is worse than not checking.
          test -f "$source" || {
            echo "::error::$source is gone; this check would pass while checking nothing"
            exit 1
          }

          names=$(grep -oE '^[[:space:]]*case [a-zA-Z]+ = "paycross\.' "$source" \
            | awk '{print $2}')
          count=$(printf '%s\n' "$names" | grep -c . || true)
          # A floor, so a pattern that stops matching is caught rather than
          # quietly reducing the check to nothing.
          if [ "$count" -lt 25 ]; then
            echo "::error::found $count identifiers in $source, expected at least 25"
            exit 1
          fi
          echo "checking $count identifiers"

          for name in $names; do
            if ! grep -rqE "payCross(Container)?Identifier\(\.$name\)|PayCrossTestIdentifiers\.$name\b" \
                 --include='*.swift' Sources/PayCross --exclude=TestIdentifiers.swift; then
              echo "::error::PayCrossTestIdentifiers.$name is published and applied nowhere."
              status=1
            fi
          done

          # The composed ones are not cases, so the loop above cannot see them.
          helpers=$(grep -oE 'public static func [a-zA-Z]+\(' "$source" \
            | awk '{print $4}' | tr -d '(')
          if [ "$(printf '%s\n' "$helpers" | grep -c . || true)" -lt 4 ]; then
            echo "::error::expected at least 4 composed identifier helpers"
            exit 1
          fi
          for helper in $helpers; do
            if ! grep -rqE "PayCrossTestIdentifiers\.$helper\(" \
                 --include='*.swift' Sources/PayCross --exclude=TestIdentifiers.swift; then
              echo "::error::PayCrossTestIdentifiers.$helper is published and applied nowhere."
              status=1
            fi
          done
          exit $status

      - name: A container's identifier leaves its children theirs
        run: |
          set -euo pipefail
          # An identifier on a container is inherited by every descendant that is
          # not already inside an element of its own, and the container's string
          # wins. 0.7.0 published paycross.sheet on the Pay button and
          # paycross.savedCards on every stored-card row this way. The container
          # spelling makes the view an element first, so the identifier lands on
          # it alone. List any new container here.
          status=0
          for name in sheet savedCards; do
            if grep -rnF "payCrossIdentifier(.$name)" --include='*.swift' Sources/PayCross; then
              echo "::error::.$name names a container: apply it with payCrossContainerIdentifier"
              status=1
            fi
            if ! grep -rqF "payCrossContainerIdentifier(.$name)" \
                 --include='*.swift' Sources/PayCross --exclude=TestIdentifiers.swift; then
              echo "::error::.$name is no longer applied as a container."
              status=1
            fi
          done
          exit $status

      - name: No identifier is set from a literal
        run: |
          set -euo pipefail
          # Every one in the SDK comes from PayCrossTestIdentifiers, so a
          # string here is either a name outside the namespace or a second copy
          # of one in it. The demo harness is not part of the contract.
          status=0
          if grep -rnE 'accessibilityIdentifier[[:space:]]*(\(|=)[[:space:]]*"' \
             --include='*.swift' Sources/PayCross; then
            status=1
          fi
          # And the same thing wrapped onto the next line, which the pattern
          # above cannot see. Only a continuation that *starts* with a quote is
          # a literal; one starting with an expression is how the composed
          # identifiers are written.
          if grep -rn -A1 --include='*.swift' \
               -E 'accessibilityIdentifier[[:space:]]*(\(|=)[[:space:]]*$' Sources/PayCross \
             | grep -E '^.*-[0-9]+-[[:space:]]*"'; then
            status=1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::set the identifier from PayCrossTestIdentifiers, not from a literal"
            exit 1
          fi
          echo "ok"
